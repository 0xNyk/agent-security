name: Bug report
description: Report a reproducible defect that does not expose a security bypass.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not publish secrets or detector bypasses here. Use the private security-report link instead.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include the command, exit code, and sanitized output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Bash version, Git version, and Python version where relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic values only.
    validations:
      required: true

