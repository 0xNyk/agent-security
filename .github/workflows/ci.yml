name: ci

# The project tests are network-free and need no secrets. Runner setup installs
# ShellCheck from Ubuntu repositories. Actions are pinned to full commit SHAs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Scanner fixture tests
        run: bash tests/test-scan.sh

      - name: Inbound-vetting fixture tests (poisoned template -> REJECT)
        run: bash tests/test-vet.sh

      - name: Harden-check scope-parsing tests (offline, mock gh auth status)
        run: bash tests/test-harden.sh

      - name: Untrusted-content scanner fixture tests
        run: bash tests/test-scan-content.sh

      - name: Repo-guard tests (offline, fake gh)
        run: bash tests/test-guard.sh

      - name: Self-scan (repo must be clean under its own scanner)
        run: bash tests/self-scan.sh

      - name: Shell lint (shellcheck)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S warning scripts/*.sh scripts/repo-guard/*.sh tests/*.sh
