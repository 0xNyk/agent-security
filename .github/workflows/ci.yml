name: ci

# The project tests are network-free and need no secrets. Runner setup installs
# ShellCheck from Ubuntu repositories. Actions are pinned to full commit SHAs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # One step on purpose. This used to be a hand-written list of suites, and two
      # suites shipped without ever being added to it. run-all.sh discovers every
      # tests/test-*.sh, so a new suite is covered the moment it exists.
      - name: Test suites (discovered) + self-scan
        run: bash tests/run-all.sh

      - name: Shell lint (shellcheck)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S warning \
            scripts/*.sh \
            scripts/repo-guard/*.sh \
            scripts/research-egress/*.sh \
            tests/*.sh
