name: ci

# Offline by design: this workflow runs only the bundled shell test suites and
# the self-scan. It makes no network calls, installs no dependencies, and needs
# no secrets. Actions are pinned to full commit SHAs (supply-chain hygiene).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Scanner fixture tests
        run: bash tests/test-scan.sh

      - name: Repo-guard tests (offline, fake gh)
        run: bash tests/test-guard.sh

      - name: Self-scan (repo must be clean under its own scanner)
        run: bash tests/self-scan.sh

      - name: Shell lint (shellcheck)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S warning scripts/*.sh scripts/repo-guard/*.sh tests/*.sh || true
